{{- if eq .Values.kind "Deployment" -}}
{{- $servicePrefix := .Values.nameOverride | default .Release.Name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ $servicePrefix }}-deployment
  labels:
    app: {{ $servicePrefix }}-app
    onechart.kubernetes.io/name: {{ $servicePrefix }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $servicePrefix }}-app
  template:
    metadata:
      labels:
        app: {{ $servicePrefix }}-app
      annotations:
        rollme: {{ randAlphaNum 16 | quote }}
      {{- if .Values.secrets.vault.enabled }}
      {{- $vault := .Values.secrets.vault }}
      {{- $agentCache := ternary ($vault.agentCache | toString) "true" (hasKey $vault "agentCache") }}
      {{- $agentInject := ternary ($vault.agentInject | toString) "true" (hasKey $vault "agentInject") }}
        vault.hashicorp.com/auth-path: {{ $vault.authPath | default "auth/dev-cluster" | quote }}
        vault.hashicorp.com/service: {{ $vault.service | default "http://vault.vault.svc.cluster.local:8200" | quote }}
        vault.hashicorp.com/agent-inject: {{ $agentInject | quote }}
        vault.hashicorp.com/role: {{ include "onechart.vaultRole" . | quote }}
        vault.hashicorp.com/agent-cache-enable: {{ $agentCache | quote }}
        {{- range $f := $vault.files }}
        vault.hashicorp.com/agent-inject-secret-{{ $f.name }}: {{ include "onechart.vaultSecretPath" (dict "ctx" $ "file" $f) | quote }}
        vault.hashicorp.com/agent-inject-template-{{ $f.name }}: |{{ include "onechart.vaultSecretTemplate" (dict "ctx" $ "file" $f) | nindent 10 }}
        {{- $refresh := $f.refreshUrl }}
        {{- if and (not $refresh) (eq $f.name "database.properties") }}
        {{- $refresh = "http://127.0.0.1:8080/actuator/refresh" }}
        {{- end }}
        {{- if $refresh }}
        vault.hashicorp.com/agent-inject-command-{{ $f.name }}: |
          wget -qO- --header='Content-Type:application/json' --post-data='{}' {{ $refresh }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- if .Values.podSpec.annotations }}
      {{- toYaml .Values.podSpec.annotations | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- toYaml .Values.hostAliases | nindent 8 }}
      {{- end }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- if .Values.podSpec.securityContext }}
      securityContext:
        {{- toYaml .Values.podSpec.securityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
        {{- range .Values.initContainers }}
        - name: {{ $servicePrefix }}-{{ .name }}-init-container
          image: "{{ .image }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy | default "Always" }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- if .command }}
          command:
            - {{ .shell }}
            - -c
            - {{ .command | quote }}
          {{- end }}
          {{- if .args }}
          args:
          {{- toYaml .args | nindent 12 }}
          {{- end }}
          {{- if or $.Values.container.env .env }}
          env:
          {{- if $.Values.container.env }}
          {{- toYaml $.Values.container.env | nindent 12 }}
          {{- end }}
          {{- if .env }}
          {{- toYaml .env | nindent 12 }}
          {{- end }}
          {{- end }}
          volumeMounts:
            {{- range $.Values.volumes }}
            - name: {{ .name }}-volume
              mountPath: {{ .path }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
              {{- if .readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $servicePrefix }}-container
          {{- if .Values.container.env }}
          env:
          {{- toYaml .Values.container.env | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $servicePrefix }}-configmap
            {{- if .Values.secrets.enabled }}
            - secretRef:
                name: {{ $servicePrefix }}-secret
            {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command:
            - {{ .Values.shell }}
            - -c
            - {{ .Values.command | quote }}
          {{- end }}
          {{- if .Values.container.args }}
          args:
          {{- toYaml .Values.container.args | nindent 12 }}
          {{- end }}
          ports:
            {{- range .Values.service }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: TCP
            {{- end }}
          {{- if .Values.startup.enabled }}
          startupProbe:
            {{- if eq .Values.startup.method "http" }}
            httpGet:
              path: {{ .Values.startup.path }}
            {{- end }}
            {{- if eq .Values.startup.method "tcp" }}
            tcpSocket:
            {{- end }}
              port: {{ .Values.startup.service }}
            initialDelaySeconds: {{.Values.startup.initialDelaySeconds}}
            periodSeconds: {{.Values.startup.periodSeconds}}
            successThreshold: {{.Values.startup.successThreshold}}
            failureThreshold: {{.Values.startup.failureThreshold}}
          {{- end }}
          {{- if .Values.liveness.enabled }}
          livenessProbe:
            {{- if eq .Values.liveness.method "http" }}
            httpGet:
              path: {{ .Values.liveness.path }}
            {{- end }}
            {{- if eq .Values.liveness.method "tcp" }}
            tcpSocket:
            {{- end }}
              port: {{ .Values.liveness.service }}
            initialDelaySeconds: {{.Values.liveness.initialDelaySeconds}}
            periodSeconds: {{.Values.liveness.periodSeconds}}
            successThreshold: {{.Values.liveness.successThreshold}}
            failureThreshold: {{.Values.liveness.failureThreshold}}
          {{- end }}
          {{- if .Values.readiness.enabled }}
          readinessProbe:
            {{- if eq .Values.liveness.method "http" }}
            httpGet:
              path: {{ .Values.readiness.path }}
            {{- end }}
            {{- if eq .Values.liveness.method "tcp" }}
            tcpSocket:
            {{- end }}
              port: {{ .Values.readiness.service }}
            initialDelaySeconds: {{.Values.readiness.initialDelaySeconds}}
            periodSeconds: {{.Values.readiness.periodSeconds}}
            successThreshold: {{.Values.readiness.successThreshold}}
            failureThreshold: {{.Values.readiness.failureThreshold}}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if gt (len .Values.volumes) 0 }}
          volumeMounts:
            {{- range .Values.volumes }}
            - name: {{ .name }}-volume
              mountPath: {{ .path }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
              {{- if .readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if gt (len .Values.volumes) 0 }}
      volumes:
        {{- range .Values.volumes }}
        - name: {{ .name }}-volume
          {{- if eq .type "secret" }}
          secret:
            {{- with .spec }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if eq .type "configMap" }}
          configMap:
            {{- with .spec }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if eq .type "static-pvc" }}
          persistentVolumeClaim:
            claimName: {{ .name }}
          {{- end }}
          {{- if eq .type "dynamic-pvc" }}
          persistentVolumeClaim:
            claimName: {{ $servicePrefix }}-{{ .name }}-data
          {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
